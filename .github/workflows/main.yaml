# main.yml
name: build profile assets

on:
  schedule:
    # Runs once a day in the window where the YouTube feed is reachable from
    # GitHub runners (00:00 UTC landed ~04:45 UTC and 404'd every time).
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: generate youtube music widget
        id: widget
        continue-on-error: true
        uses: daeun503/profile-music-widget@v1
        with:
          playlist_id: "PLHx7aaR3gT6tRf9d7Spo23mj1o-R5X0OJ"

      - name: Wait before retry
        if: steps.widget.outcome != 'success'
        run: sleep 45

      - name: generate youtube music widget (retry)
        id: widget_retry
        if: steps.widget.outcome != 'success'
        continue-on-error: true
        uses: daeun503/profile-music-widget@v1
        with:
          playlist_id: "PLHx7aaR3gT6tRf9d7Spo23mj1o-R5X0OJ"

      - name: Deploy dist to output branch
        if: steps.widget.outcome == 'success' || steps.widget_retry.outcome == 'success'
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn when the widget could not be generated
        if: steps.widget.outcome != 'success' && steps.widget_retry.outcome != 'success'
        run: echo "::warning::Widget generation failed (YouTube feed blocked this runner). Keeping the last published widget."
